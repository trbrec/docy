name: Deploy Docy theme

# Production deployment is triggered by every merged main revision. Revision: academy-seed-v5-timebounded.

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-docy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          audience='https://faq.trbrec.com/wp-json/trb/v1/deploy'
          token_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=$(python3 -c 'import urllib.parse; print(urllib.parse.quote("'"'"$audience"'"'", safe=""))')"
          token=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${token_url}" | jq -r '.value')
          test -n "${token}" && test "${token}" != "null"
          echo "token=${token}" >> "${GITHUB_OUTPUT}"

      - name: Deploy verified main commit
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          payload=$(jq -nc --arg sha "${GITHUB_SHA}" '{sha: $sha}')
          token_payload=$(printf '%s' "${OIDC_TOKEN}" | cut -d. -f2)
          token_payload="${token_payload}$(printf '=%.0s' $(seq 1 $(( (4 - ${#token_payload} % 4) % 4 ))))"
          printf '%s' "${token_payload}" | base64 -d 2>/dev/null | jq '{iss, aud, repository, ref, event_name, sha, exp, nbf}'
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 20 \
            --retry 3 --retry-delay 20 --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "User-Agent: TRB-GitHub-Deploy/1.0" \
            --data "${payload}" \
            https://faq.trbrec.com/wp-json/trb/v1/deploy

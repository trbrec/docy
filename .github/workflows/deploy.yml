name: Deploy Docy theme

# Revision: full-portal-audit-2026-08-24-1052.

# Production deployment is triggered by every merged main revision. Revision: academy-seed-v5-production.

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 5,17 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-docy-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out the exact main revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate PHP and portal regressions
        shell: bash
        run: |
          php tools/test-release-sheet-data.php
          node tests/release-draft-restore.test.js
          node tests/release-completed-receipt.test.js
          node tests/release-draft-clear.test.js
          php tools/test-release-draft-clear.php
          php tools/test-acr-dual-recovery.php
          node tests/release-master-retry.test.js
          node tests/release-file-retry.test.js
          php tools/test-release-file-retry.php
          node tests/release-audio-validation-race.test.js
          find . -path './vendor' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
          php tools/test-release-draft-normalizer.php
          php tools/test-release-staging-cleanup.php
          php tools/test-demo-delivery-window.php
          php tools/test-demo-context.php
          php tools/test-demo-staged-upload.php
          node tests/demo-chunk-upload.test.js
          php tools/test-demo-email.php
          php tools/test-onboarding-pcloud.php
          php tools/test-onboarding-drive.php
          php tools/test-onboarding-entry.php
          php tools/test-onboarding-workflow.php
          php tools/test-crm-contract-mail-queue.php
          php tools/test-onboarding.php
          php tools/test-onboarding-service.php
          php tools/test-onboarding-adapters.php
          php tools/test-onboarding-intake.php
          node tests/onboarding-signature.test.js
          node tests/onboarding-document.test.js
          node tests/onboarding-drive.test.js
          node tests/onboarding-form.test.js
          php tools/test-store-benefits.php
          php tools/test-demo-services.php
          php tools/test-rights-owner-review.php
          php tools/test-crm-inline-review.php
          php tools/test-crm-performance.php
          python3 tools/portal-audit.py

      - name: Deploy and verify exact main revision over SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SITEGROUND_SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SITEGROUND_SSH_PASSPHRASE }}
          SSH_HOST: ${{ secrets.SITEGROUND_SSH_HOST }}
          SSH_USER: ${{ secrets.SITEGROUND_SSH_USER }}
          SSH_PORT: ${{ secrets.SITEGROUND_SSH_PORT }}
          DEPLOY_PATH: /home/customer/www/artist.trbrec.com/public_html/wp-content/themes/docy
        run: |
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${HOME}/.ssh/id_ed25519"
          chmod 600 "${HOME}/.ssh/id_ed25519"
          askpass=$(mktemp)
          printf '#!/bin/sh\nprintf "%%s\\n" "$SSH_PASSPHRASE"\n' > "${askpass}"
          chmod 700 "${askpass}"
          eval "$(ssh-agent -s)"
          SSH_ASKPASS="${askpass}" SSH_ASKPASS_REQUIRE=force DISPLAY=: \
            ssh-add "${HOME}/.ssh/id_ed25519" </dev/null
          rm -f "${askpass}"
          ssh-keyscan -p "${SSH_PORT}" "${SSH_HOST}" >> "${HOME}/.ssh/known_hosts"
          remote="${SSH_USER}@${SSH_HOST}"
          ssh_opts=(-p "${SSH_PORT}" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          rsync -az --checksum \
            --exclude='.git/' --exclude='.github/' --exclude='.trb-deployed-sha' \
            -e "ssh -p ${SSH_PORT} -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            ./ "${remote}:${DEPLOY_PATH}/"
          printf '%s\n' "${GITHUB_SHA}" | \
            ssh "${ssh_opts[@]}" "${remote}" "cat > '${DEPLOY_PATH}/.trb-deployed-sha'"
          deployed_sha=$(ssh "${ssh_opts[@]}" "${remote}" "cat '${DEPLOY_PATH}/.trb-deployed-sha'")
          test "${deployed_sha}" = "${GITHUB_SHA}"
          ssh "${ssh_opts[@]}" "${remote}" \
            "php -l '${DEPLOY_PATH}/functions.php' && php -l '${DEPLOY_PATH}/inc/trb-resource-monitor.php'"
          echo "Successfully deployed and verified ${deployed_sha}."

          ssh "${ssh_opts[@]}" "${remote}" "php '${DEPLOY_PATH}/tools/record-ssh-deployment.php' '${GITHUB_SHA}'" >/dev/null 2>&1
          echo "WordPress deployment safety net aligned with the verified SSH revision."
          if git diff --name-only "${GITHUB_SHA}^1" "${GITHUB_SHA}" | grep -E '^(integrations/onboarding/|inc/trb-candidate-onboarding|assets/js/onboarding/|tools/(deploy-onboarding|onboarding-deploy-status|onboarding-readiness)\.php)' >/dev/null; then
            onboarding_readiness=$(ssh "${ssh_opts[@]}" "${remote}" "php '${DEPLOY_PATH}/tools/onboarding-readiness.php' '${GITHUB_SHA}'" 2>/dev/null || true)
            printf '%s' "${onboarding_readiness}" | python3 -c 'import sys,json; d=json.load(sys.stdin); keys=("revision","archive_connection","portal_secret","identity_key","signature_secret","invitation_key","signature_adapter","mail_adapter","contract_sources","portal_adapter"); [print("Onboarding prerequisite "+k+": "+("verified" if d.get(k) is True else "unconfirmed")) for k in keys]' 2>/dev/null || echo "Onboarding readiness report unavailable."
            printf '%s' "${onboarding_readiness}" | python3 -c 'import sys,json; d=json.load(sys.stdin); keys=("portal_loaded","portal_route_loaded","portal_key_matches","portal_store_configured","portal_approval_plugin","portal_http_2xx","portal_http_403","portal_http_404","portal_http_5xx"); [print("Onboarding portal check "+k+": "+("yes" if d.get(k) is True else "no")) for k in keys]' 2>/dev/null || true
            if ! printf '%s' "${onboarding_readiness}" | python3 -c 'import sys,json; d=json.load(sys.stdin);sys.exit(0 if d.get("revision") is True and type(d.get("archive_connection")) is bool else 1)' 2>/dev/null; then
              echo "Onboarding readiness report invalid; activation stopped."
              exit 1
            fi
            if printf '%s' "${onboarding_readiness}" | python3 -c 'import sys,json;sys.exit(0 if json.load(sys.stdin).get("archive_connection") is False else 1)' 2>/dev/null; then
              echo "Onboarding activation pending: private Google Drive archive verification is required. Existing features continue to deploy."
            else
              if ! ssh "${ssh_opts[@]}" "${remote}" "php -l '${DEPLOY_PATH}/tools/deploy-onboarding.php' && php -l '${DEPLOY_PATH}/tools/onboarding-deploy-status.php'" >/dev/null 2>&1; then
                echo "Onboarding installer failed its server syntax check."
                exit 1
              fi
              if onboarding_result=$(ssh "${ssh_opts[@]}" "${remote}" "php '${DEPLOY_PATH}/tools/onboarding-deploy-status.php' '${GITHUB_SHA}' --enable" 2>/dev/null) && printf '%s' "${onboarding_result}" | python3 -c 'import sys,json;sys.exit(0 if json.load(sys.stdin).get("success") is True else 1)' 2>/dev/null; then
                echo "Onboarding installer completed."
              else
                onboarding_stage=$(printf '%s' "${onboarding_result}" | python3 -c 'import sys,json; d=json.load(sys.stdin); s=d.get("stage", "unknown"); print(s if isinstance(s,str) and len(s)<50 and all(c.islower() or c=="-" for c in s) else "unknown")' 2>/dev/null || true)
                case "${onboarding_stage}" in revision-guard|bootstrap|store-bootstrap|store-bootstrap-wp-exit|store-bootstrap-wp-json|crm-entry|crm-navigation|crm-workflow|crm-workflow-repository|crm-workflow-assets|store-stage|activation-snapshot|activation-snapshot-wp-exit|activation-snapshot-wp-json|file-install|database|archive|archive-config|archive-trb|archive-ddb|configuration|signature-health|contract-sources|portal-health|activation|activation-wp-exit|activation-wp-json) echo "Onboarding installation unconfirmed at ${onboarding_stage}." ;; *) echo "Onboarding installation unconfirmed at unknown stage." ;; esac
                exit 1
              fi
              echo "New onboarding adapters, contract sources and scheduled worker verified."
            fi
          fi
          if git diff --name-only "${GITHUB_SHA}^1" "${GITHUB_SHA}" | grep -E '^(tools/finish-onboarding-privacy\.php|inc/trb-candidate-(privacy-page|onboarding)\.php|tools/check-workflow-yaml\.py)$' >/dev/null; then
            ssh "${ssh_opts[@]}" "${remote}" "php '${DEPLOY_PATH}/tools/finish-onboarding-privacy.php' '${GITHUB_SHA}'" >/dev/null 2>&1
            echo "Artist privacy published, linked and anonymously reachable; instant-payment copy verified."
          fi
          if git diff --name-only "${GITHUB_SHA}^1" "${GITHUB_SHA}" -- tools/verify-onboarding-reader-live.php | grep -qx 'tools/verify-onboarding-reader-live.php'; then
            ssh "${ssh_opts[@]}" "${remote}" "php '${DEPLOY_PATH}/tools/verify-onboarding-reader-live.php' '${GITHUB_SHA}'" >/dev/null 2>&1
            echo 'Synthetic two-front OpenAI comparison verified.'
          fi
          if git diff --name-only "${GITHUB_SHA}^1" "${GITHUB_SHA}" -- tools/qa-onboarding-fronts-live.php | grep -qx 'tools/qa-onboarding-fronts-live.php'; then
            ssh "${ssh_opts[@]}" "${remote}" "php '${DEPLOY_PATH}/tools/qa-onboarding-fronts-live.php' '${GITHUB_SHA}'" >/dev/null 2>&1
            echo 'Synthetic browser preflight, direct Drive upload, private hashes and live candidate page verified.'
          fi
          if git diff --name-only "${GITHUB_SHA}^1" "${GITHUB_SHA}" | grep -x 'tools/refresh-release-sheet-live.php' >/dev/null; then
            ssh "${ssh_opts[@]}" "${remote}" "php '${DEPLOY_PATH}/tools/refresh-release-sheet-live.php' '${GITHUB_SHA}'" >/dev/null 2>&1
          fi
          if git diff --name-only "${GITHUB_SHA}^1" "${GITHUB_SHA}" | grep -x 'tools/recover-acr-dual-live.php' >/dev/null; then
            ssh "${ssh_opts[@]}" "${remote}" "php '${DEPLOY_PATH}/tools/recover-acr-dual-live.php' '${GITHUB_SHA}'" >/dev/null 2>&1
            echo "Existing ACR jobs checked through normal pipeline guards."
          fi
          if git diff --name-only "${GITHUB_SHA}^1" "${GITHUB_SHA}" | grep -x 'tools/audit-release-integrity-live.php' >/dev/null; then
            ssh "${ssh_opts[@]}" "${remote}" "php '${DEPLOY_PATH}/tools/audit-release-integrity-live.php' '${GITHUB_SHA}' --repair-empty-greed" >/dev/null 2>&1
          fi
          if git diff --name-only "${GITHUB_SHA}^1" "${GITHUB_SHA}" | grep -x 'tools/audit-release-file-retry-live.php' >/dev/null; then
            ssh "${ssh_opts[@]}" "${remote}" "php '${DEPLOY_PATH}/tools/audit-release-file-retry-live.php' '${GITHUB_SHA}'" >/dev/null 2>&1
          fi
          if git diff --name-only "${GITHUB_SHA}^1" "${GITHUB_SHA}" | grep -x 'tools/recover-acr-budget-live.php' >/dev/null; then
            ssh "${ssh_opts[@]}" "${remote}" "php '${DEPLOY_PATH}/tools/recover-acr-budget-live.php' '${GITHUB_SHA}'" >/dev/null 2>&1
          fi
          if git diff --name-only "${GITHUB_SHA}^1" "${GITHUB_SHA}" | grep -E '^tools/(deploy-crm-performance|crm-performance-patch)\.php$' >/dev/null; then
            ssh "${ssh_opts[@]}" "${remote}" "php '${DEPLOY_PATH}/tools/deploy-crm-performance.php' '${GITHUB_SHA}'" >/dev/null 2>&1
            echo "CRM read-path performance installation verified."
          fi
          if git diff --name-only "${GITHUB_SHA}^1" "${GITHUB_SHA}" | grep -x 'tools/deploy-crm-inline-review.php' >/dev/null; then
            ssh "${ssh_opts[@]}" "${remote}" "php '${DEPLOY_PATH}/tools/deploy-crm-inline-review.php' '${GITHUB_SHA}'" >/dev/null 2>&1
            echo "CRM inline review deployment verified."
          fi
          if git diff --name-only "${GITHUB_SHA}^1" "${GITHUB_SHA}" | grep -x 'tools/deploy-crm-rights-visibility.php' >/dev/null; then
            ssh "${ssh_opts[@]}" "${remote}" "php '${DEPLOY_PATH}/tools/deploy-crm-rights-visibility.php' '${GITHUB_SHA}'" >/dev/null 2>&1
          fi
          if git diff --name-only "${GITHUB_SHA}^1" "${GITHUB_SHA}" | grep -x 'tools/qa-demo-footer.php' >/dev/null; then
            ssh "${ssh_opts[@]}" "${remote}" "php '${DEPLOY_PATH}/tools/qa-demo-footer.php' '${GITHUB_SHA}'" >/dev/null 2>&1
          fi
          if git diff --name-only "${GITHUB_SHA}^1" "${GITHUB_SHA}" | grep -x 'tools/qa-demo-upload-live.php' >/dev/null; then
            if ! ssh "${ssh_opts[@]}" "${remote}" "php '${DEPLOY_PATH}/tools/qa-demo-upload-live.php' '${GITHUB_SHA}'" >/dev/null 2>&1; then
              qa_stage=$(ssh "${ssh_opts[@]}" "${remote}" "cat '${DEPLOY_PATH}/.trb-demo-qa-${GITHUB_SHA}' 2>/dev/null; rm -f '${DEPLOY_PATH}/.trb-demo-qa-${GITHUB_SHA}'")
              case "${qa_stage}" in bootstrap|account|session|directory|http|staging|type-text|type-audio|store-text|store-audio|saved-text|saved-audio|hash-text|hash-audio|error-text-guard|error-text-mime|error-text-filesystem|error-text-other|error-audio-guard|error-audio-mime|error-audio-filesystem|error-audio-other) echo "Isolated demo QA failed at ${qa_stage}." ;; *) echo "Isolated demo QA failed at unknown stage." ;; esac
              exit 1
            fi
            echo "Isolated live demo HTTP upload and private storage verified."
          fi
          if git diff --name-only "${GITHUB_SHA}^1" "${GITHUB_SHA}" | grep -x 'tools/qa-demo-flow-live.php' >/dev/null; then
            if ! ssh "${ssh_opts[@]}" "${remote}" "php '${DEPLOY_PATH}/tools/qa-demo-flow-live.php' '${GITHUB_SHA}' audio" >/dev/null 2>&1; then
              qa_stage=$(ssh "${ssh_opts[@]}" "${remote}" "cat '${DEPLOY_PATH}/.trb-demo-flow-qa-${GITHUB_SHA}' 2>/dev/null; rm -f '${DEPLOY_PATH}/.trb-demo-flow-qa-${GITHUB_SHA}'")
              case "${qa_stage}" in bootstrap|fixture|staging|submit|process|archive|archive-missing_webdav_settings|archive-http_request_failed|archive-webdav_mkdir_failed|archive-webdav_upload_failed|archive-webdav_local_hash_failed|archive-webdav_verify_read_failed|archive-webdav_verify_mismatch|archive-other|evaluation|worker|sheet|email) echo "Owner demo flow QA failed at ${qa_stage}." ;; *) echo "Owner demo flow QA failed at unknown stage." ;; esac
              exit 1
            fi
            echo "Owner-only demo submission, processing and email composition verified."
          fi


  trigger-daily-site-health:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Activate the site-native daily monitor
        shell: bash
        run: |
          curl --fail --silent --show-error --connect-timeout 5 --max-time 45 \
            -H "Cache-Control: no-cache" \
            -H "User-Agent: TRB-Daily-Site-Health/1.0" \
            "https://artist.trbrec.com/wp-cron.php?doing_wp_cron=$(date +%s)" >/dev/null

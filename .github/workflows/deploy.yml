name: Deploy Docy theme

# Revision: full-portal-audit-2026-08-24-1052.

# Production deployment is triggered by every merged main revision. Revision: academy-seed-v5-production.

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 5,17 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-docy-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out the exact main revision
        uses: actions/checkout@v4

      - name: Validate PHP and portal regressions
        shell: bash
        run: |
          node tests/release-draft-restore.test.js
          find . -path './vendor' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
          php tools/test-release-draft-normalizer.php
          php tools/test-release-staging-cleanup.php
          php tools/test-demo-delivery-window.php
          python3 tools/portal-audit.py

      - name: Deploy and verify exact main revision over SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SITEGROUND_SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SITEGROUND_SSH_PASSPHRASE }}
          SSH_HOST: ${{ secrets.SITEGROUND_SSH_HOST }}
          SSH_USER: ${{ secrets.SITEGROUND_SSH_USER }}
          SSH_PORT: ${{ secrets.SITEGROUND_SSH_PORT }}
          DEPLOY_PATH: /home/customer/www/artist.trbrec.com/public_html/wp-content/themes/docy
        run: |
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${HOME}/.ssh/id_ed25519"
          chmod 600 "${HOME}/.ssh/id_ed25519"
          askpass=$(mktemp)
          printf '#!/bin/sh\nprintf "%%s\\n" "$SSH_PASSPHRASE"\n' > "${askpass}"
          chmod 700 "${askpass}"
          eval "$(ssh-agent -s)"
          SSH_ASKPASS="${askpass}" SSH_ASKPASS_REQUIRE=force DISPLAY=: \
            ssh-add "${HOME}/.ssh/id_ed25519" </dev/null
          rm -f "${askpass}"
          ssh-keyscan -p "${SSH_PORT}" "${SSH_HOST}" >> "${HOME}/.ssh/known_hosts"
          remote="${SSH_USER}@${SSH_HOST}"
          ssh_opts=(-p "${SSH_PORT}" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          rsync -az --checksum \
            --exclude='.git/' --exclude='.github/' --exclude='.trb-deployed-sha' \
            -e "ssh -p ${SSH_PORT} -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            ./ "${remote}:${DEPLOY_PATH}/"
          printf '%s\n' "${GITHUB_SHA}" | \
            ssh "${ssh_opts[@]}" "${remote}" "cat > '${DEPLOY_PATH}/.trb-deployed-sha'"
          deployed_sha=$(ssh "${ssh_opts[@]}" "${remote}" "cat '${DEPLOY_PATH}/.trb-deployed-sha'")
          test "${deployed_sha}" = "${GITHUB_SHA}"
          ssh "${ssh_opts[@]}" "${remote}" \
            "php -l '${DEPLOY_PATH}/functions.php' && php -l '${DEPLOY_PATH}/inc/trb-resource-monitor.php'"
          echo "Successfully deployed and verified ${deployed_sha}."

  trigger-daily-site-health:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Activate the site-native daily monitor
        shell: bash
        run: |
          curl --fail --silent --show-error --connect-timeout 5 --max-time 45 \
            -H "Cache-Control: no-cache" \
            -H "User-Agent: TRB-Daily-Site-Health/1.0" \
            "https://artist.trbrec.com/wp-cron.php?doing_wp_cron=$(date +%s)" >/dev/null

name: Deploy Docy theme

# Revision: demo-opcache-v1.

# Production deployment is triggered by every merged main revision. Revision: academy-seed-v5-production.

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-docy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          audience='https://faq.trbrec.com/wp-json/trb/v1/deploy'
          audience_encoded=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "${audience}")
          token_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience_encoded}"
          token=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${token_url}" | jq -r '.value')
          test -n "${token}" && test "${token}" != "null"
          echo "token=${token}" >> "${GITHUB_OUTPUT}"

      - name: Deploy verified main commit
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          payload=$(jq -nc --arg sha "${GITHUB_SHA}" '{sha: $sha}')
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 20 \
            --retry 3 --retry-delay 20 --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "User-Agent: TRB-GitHub-Deploy/1.0" \
            --data "${payload}" \
            https://faq.trbrec.com/wp-json/trb/v1/deploy

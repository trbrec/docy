name: Deploy Docy theme

# Revision: full-portal-audit-2026-08-24-1052.

# Production deployment is triggered by every merged main revision. Revision: academy-seed-v5-production.

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-docy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          audience='https://artist.trbrec.com/wp-json/trb/v1/deploy'
          audience_encoded=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "${audience}")
          token_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience_encoded}"
          token=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${token_url}" | jq -r '.value')
          test -n "${token}" && test "${token}" != "null"
          echo "token=${token}" >> "${GITHUB_OUTPUT}"

      - name: Deploy verified main commit
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          payload=$(jq -nc --arg sha "${GITHUB_SHA}" '{sha: $sha}')
          response_file=$(mktemp)
          headers_file=$(mktemp)
          http_code=$(curl --silent --show-error --connect-timeout 10 --max-time 240 \
            -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -H "User-Agent: Mozilla/5.0 (compatible; TRB-GitHub-Deploy/1.1)" \
            --data "${payload}" \
            -D "${headers_file}" -o "${response_file}" -w '%{http_code}' \
            https://artist.trbrec.com/wp-json/trb/v1/deploy || true)
          if jq -e --arg sha "${GITHUB_SHA}" '.success == true and .sha == $sha' "${response_file}" >/dev/null 2>&1; then
            cat "${response_file}"
            exit 0
          fi
          content_type=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub("\r",""); print $2; exit}' "${headers_file}")
          if grep -qi '^sg-captcha:[[:space:]]*challenge' "${headers_file}"; then
            echo "::notice::SiteGround challenged the GitHub runner before WordPress. Deployment remains queued through the five-minute internal WordPress safety net."
            rm -f "${response_file}" "${headers_file}"
            exit 0
          fi
          echo "Direct deploy returned HTTP ${http_code}, content-type ${content_type:-unknown}; activating the WordPress cron fallback."
          rm -f "${response_file}" "${headers_file}"

          for attempt in $(seq 1 30); do
            if [[ "${attempt}" == "1" || $(( attempt % 3 )) == "0" ]]; then
              curl --silent --show-error --connect-timeout 10 --max-time 60 \
                "https://artist.trbrec.com/wp-cron.php?doing_wp_cron=$(date +%s).${attempt}" >/dev/null || true
            fi
            status_file=$(mktemp)
            status_code=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              -H "Accept: application/json" \
              -H "Cache-Control: no-cache" \
              -o "${status_file}" -w '%{http_code}' \
              "https://artist.trbrec.com/wp-json/trb/v1/deploy-status?check=${attempt}" || true)
            if [[ "${status_code}" == "200" ]] && jq -e --arg sha "${GITHUB_SHA}" '.sha == $sha' "${status_file}" >/dev/null 2>&1; then
              cat "${status_file}"
              exit 0
            fi
            rm -f "${status_file}"
            echo "Cron deploy verification ${attempt}/30 is still waiting for ${GITHUB_SHA}."
            sleep 10
          done
          echo "::error::Neither the direct endpoint nor the verified WordPress cron fallback deployed ${GITHUB_SHA}."
          exit 1

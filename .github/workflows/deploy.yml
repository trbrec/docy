name: Deploy Docy theme

# Revision: stable-rollback-redeploy-2026-08-04.

# Production deployment is triggered by every merged main revision. Revision: academy-seed-v5-production.

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-docy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          audience='https://artist.trbrec.com/wp-json/trb/v1/deploy'
          audience_encoded=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "${audience}")
          token_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience_encoded}"
          token=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${token_url}" | jq -r '.value')
          test -n "${token}" && test "${token}" != "null"
          echo "token=${token}" >> "${GITHUB_OUTPUT}"

      - name: Deploy verified main commit
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          payload=$(jq -nc --arg sha "${GITHUB_SHA}" '{sha: $sha}')
          for attempt in 1 2 3 4 5 6; do
            response_file=$(mktemp)
            headers_file=$(mktemp)
            http_code=$(curl --silent --show-error --connect-timeout 10 --max-time 240 \
              -X POST \
              -H "Authorization: Bearer ${OIDC_TOKEN}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -H "User-Agent: Mozilla/5.0 (compatible; TRB-GitHub-Deploy/1.1)" \
              --data "${payload}" \
              -D "${headers_file}" -o "${response_file}" -w '%{http_code}' \
              https://artist.trbrec.com/wp-json/trb/v1/deploy)
            if jq -e --arg sha "${GITHUB_SHA}" '.success == true and .sha == $sha' "${response_file}" >/dev/null 2>&1; then
              cat "${response_file}"
              exit 0
            fi
            content_type=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub("\r",""); print $2; exit}' "${headers_file}")
            echo "Deploy attempt ${attempt}/6 returned HTTP ${http_code}, content-type ${content_type:-unknown}."
            head -c 2000 "${response_file}"
            rm -f "${response_file}" "${headers_file}"
            sleep $(( attempt * 10 ))
          done
          echo "::error::Deploy endpoint did not return a verified success payload after 6 attempts."
          exit 1

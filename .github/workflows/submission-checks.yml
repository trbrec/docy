name: Portal pre-merge checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install audio measurement dependency
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: PHP syntax and submission diagnostics
        run: |
          find . -path './vendor' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
          php tools/test-submission-diagnostics.php
          php tools/test-release-credit-roles.php
          php tools/test-release-intake.php
          php tools/test-release-recovery.php
          php tools/test-crm-transfer-health.php
          php tools/test-acr-budget-notices.php
          php tools/test-pcm-full-scale.php
          php tools/test-true-peak.php
          php tools/test-demo-delivery-window.php
          php tools/test-demo-runtime-recovery.php
          php tools/test-demo-context.php
          php tools/test-demo-email.php
          node --check assets/js/trb-demo-evaluation.js
          php tools/test-audio-inventory.php
          php tools/test-rights-owner-review.php
          node tests/release-credit-options.test.js
          node tests/release-single-title.test.js
          php tools/test-release-draft-normalizer.php
          php tools/test-release-staging-cleanup.php
          node tests/release-draft-restore.test.js
          python3 tools/portal-audit.py

name: Read-only pending onboarding compatibility
on:
  push:
    branches: [fix/portal-audit-20261010]
    paths: [tools/onboarding-compatibility-request.json]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect aggregate practice compatibility without changing CRM data
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SITEGROUND_SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SITEGROUND_SSH_PASSPHRASE }}
          SSH_HOST: ${{ secrets.SITEGROUND_SSH_HOST }}
          SSH_USER: ${{ secrets.SITEGROUND_SSH_USER }}
          SSH_PORT: ${{ secrets.SITEGROUND_SSH_PORT }}
        run: |
          set -euo pipefail
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${HOME}/.ssh/id_ed25519"
          chmod 600 "${HOME}/.ssh/id_ed25519"
          askpass=$(mktemp)
          printf '#!/bin/sh\nprintf "%%s\\n" "$SSH_PASSPHRASE"\n' > "${askpass}"
          chmod 700 "${askpass}"
          eval "$(ssh-agent -s)"
          SSH_ASKPASS="${askpass}" SSH_ASKPASS_REQUIRE=force DISPLAY=: ssh-add "${HOME}/.ssh/id_ed25519" </dev/null
          rm -f "${askpass}"
          ssh-keyscan -T 10 -p "${SSH_PORT}" "${SSH_HOST}" > "${HOME}/.ssh/known_hosts"
          remote="${SSH_USER}@${SSH_HOST}"
          ssh_opts=(-p "${SSH_PORT}" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          source_file=$(ssh "${ssh_opts[@]}" "${remote}" 'mktemp /home/customer/www/crm.trbrec.com/private/onboarding-compatibility.XXXXXXXX.php')
          [[ "${source_file}" =~ ^/home/customer/www/crm\.trbrec\.com/private/onboarding-compatibility\.[A-Za-z0-9]{8}\.php$ ]]
          cleanup() {
            ssh "${ssh_opts[@]}" "${remote}" "rm -f -- '${source_file}'; test ! -e '${source_file}'" >/dev/null 2>&1
            ssh-add -D >/dev/null 2>&1 || true
            rm -f "${HOME}/.ssh/id_ed25519"
          }
          trap cleanup EXIT
          scp -q -P "${SSH_PORT}" -o BatchMode=yes -o StrictHostKeyChecking=yes tools/qa-crm-onboarding-inventory.php "${remote}:${source_file}"
          ssh "${ssh_opts[@]}" "${remote}" "php '${source_file}'" > /tmp/onboarding-compatibility.json 2>/dev/null
          python3 -c 'import json;d=json.load(open("/tmp/onboarding-compatibility.json"));assert d.get("read_only") is True and d.get("personal_data_exported") is False'
      - name: Preserve non-personal compatibility classifications
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-compatibility
          path: /tmp/onboarding-compatibility.json
          retention-days: 7

name: New1 public website installed audit
on:
  push:
    branches: [fix/public-roster-audit-fixtures]
    paths: ['tools/audit-new1-installed.php', '.github/workflows/new1-installed-audit.yml']
permissions:
  contents: read
concurrency:
  group: trb-new1-installed-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: php -l tools/audit-new1-installed.php
      - name: Read new1 code and configuration shape without starting integrations
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SITEGROUND_SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SITEGROUND_SSH_PASSPHRASE }}
          SSH_HOST: ${{ secrets.SITEGROUND_SSH_HOST }}
          SSH_USER: ${{ secrets.SITEGROUND_SSH_USER }}
          SSH_PORT: ${{ secrets.SITEGROUND_SSH_PORT }}
        run: |
          set -euo pipefail
          install -d -m 700 "${HOME}/.ssh" /tmp/trb-new1-audit
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${HOME}/.ssh/id_ed25519"
          chmod 600 "${HOME}/.ssh/id_ed25519"
          askpass=$(mktemp)
          printf '#!/bin/sh\nprintf "%%s\\n" "$SSH_PASSPHRASE"\n' > "${askpass}"
          chmod 700 "${askpass}"
          eval "$(ssh-agent -s)"
          SSH_ASKPASS="${askpass}" SSH_ASKPASS_REQUIRE=force DISPLAY=: ssh-add "${HOME}/.ssh/id_ed25519" </dev/null
          rm -f "${askpass}"
          ssh-keyscan -p "${SSH_PORT}" "${SSH_HOST}" >> "${HOME}/.ssh/known_hosts"
          remote="${SSH_USER}@${SSH_HOST}"
          ssh_opts=(-p "${SSH_PORT}" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          qa_dir=$(ssh "${ssh_opts[@]}" "${remote}" 'mktemp -d /tmp/trb-new1-audit.XXXXXXXX')
          [[ "${qa_dir}" =~ ^/tmp/trb-new1-audit\.[A-Za-z0-9]{8}$ ]]
          cleanup() {
            ssh "${ssh_opts[@]}" "${remote}" "rm -f '${qa_dir}/inventory.php'; rmdir '${qa_dir}'" >/dev/null 2>&1 || true
            ssh-add -D >/dev/null 2>&1 || true
            rm -f "${HOME}/.ssh/id_ed25519"
          }
          trap cleanup EXIT
          scp -P "${SSH_PORT}" -o BatchMode=yes -o StrictHostKeyChecking=yes tools/audit-new1-installed.php "${remote}:${qa_dir}/inventory.php"
          ssh "${ssh_opts[@]}" "${remote}" "php -d allow_url_fopen=0 -d disable_functions=mail,curl_exec,curl_multi_exec,fsockopen,pfsockopen,stream_socket_client '${qa_dir}/inventory.php'" > /tmp/trb-new1-audit/installed.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/trb-new1-audit/installed.json'))
          assert r['read_only'] and not r['contains_artist_rows'] and r['site'].rstrip('/')=='https://new1.trbrec.com'
          print('Read-only new1 inventory completed; no application workers, mail, provider requests or artist records exported.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: new1-installed-audit
          path: /tmp/trb-new1-audit/installed.json
          retention-days: 3
          if-no-files-found: error

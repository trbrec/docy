name: Temporary REAPER Google batch translation test

on:
  push:
    branches:
      - tmp/reaper-qwen-test-20260905
    paths:
      - .github/workflows/tmp-reaper-qwen-test.yml
      - tools/tmp_reaper_qwen/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test batched translation endpoint
        run: python tools/tmp_reaper_qwen/test_google_batch.py

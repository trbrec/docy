name: TRB Site Studio checks
on:
  push:
    branches: [main, codex/studio-directory-sync-20261006]
    paths:
      - 'integrations/site-studio/**'
      - '.github/workflows/site-studio-checks.yml'
  pull_request:
    paths:
      - 'integrations/site-studio/**'
      - 'tools/deploy-site-studio.php'
      - 'tools/sync-site-studio.php'
      - '.github/workflows/site-studio-checks.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate syntax and script
        run: |
          find integrations/site-studio -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l tools/deploy-site-studio.php
          php -l tools/sync-site-studio.php
          node --check integrations/site-studio/trb-site-studio/editor.js
      - name: Test against WordPress sanitizer
        run: |
          curl --fail --silent --show-error --location https://wordpress.org/latest.tar.gz -o /tmp/trb-wp-test.tar.gz
          mkdir -p /tmp/trb-wp-test
          tar -xzf /tmp/trb-wp-test.tar.gz -C /tmp/trb-wp-test
          TRB_WP_TEST_ROOT=/tmp/trb-wp-test/wordpress php integrations/site-studio/test-studio.php

      - name: Validate compact artist cards and render fixture
        run: php integrations/site-studio/test-artist-cards.php --fixture > /tmp/trb-roster-fixture.html
      - name: Install browser for roster layout validation
        run: |
          npm install --prefix /tmp/trb-roster-browser --no-save playwright@1.62.1
          /tmp/trb-roster-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Validate responsive roster and accessible disclosures
        run: |
          NODE_PATH=/tmp/trb-roster-browser/node_modules node integrations/site-studio/artist-cards.test.cjs
          TRB_ROSTER_SCREENSHOTS=/tmp/trb-roster-live NODE_PATH=/tmp/trb-roster-browser/node_modules node integrations/site-studio/artist-cards.test.cjs --live
      - name: Preserve screenshots of the actual published roster
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trb-roster-live-${{ github.sha }}
          path: /tmp/trb-roster-live
          retention-days: 14


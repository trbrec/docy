name: Temporary REAPER 7.79 Italian LangPack build

on:
  push:
    branches:
      - tmp/reaper-779-it-build-20260905
    paths:
      - .github/workflows/tmp-reaper-langpack-it-779.yml
      - tools/tmp_reaper_it/**

permissions:
  contents: read

jobs:
  build:
    name: Build and verify language pack
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "4"
    steps:
      - name: Check out temporary build branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install translation runtime
        run: python -m pip install --disable-pip-version-check --upgrade "ctranslate2>=4.5,<5" "sentencepiece>=0.2,<0.3"

      - name: Build complete Italian REAPER 7.79 Core language pack
        run: python tools/tmp_reaper_it/build_langpack.py

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: REAPER-7.79-Italiano-Completo-RC1
          path: artifacts/reaper-langpack-it-779/
          if-no-files-found: error
          compression-level: 9
          retention-days: 1

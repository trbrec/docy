name: Temporary REAPER translation model test

on:
  push:
    branches:
      - tmp/reaper-779-it-build-20260905
    paths:
      - .github/workflows/tmp-reaper-langpack-it-779.yml
      - tools/tmp_reaper_it/test_m2m.py

permissions:
  contents: read

jobs:
  test:
    name: Test M2M100 on REAPER UI strings
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "4"
      HF_HUB_DISABLE_XET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check "ctranslate2>=4.5,<5" "sentencepiece>=0.2,<0.3" "transformers>=4.48,<5" "huggingface_hub>=0.27,<2"
      - name: Run sample translation
        run: python tools/tmp_reaper_it/test_m2m.py
